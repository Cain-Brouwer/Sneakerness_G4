# Docker Compose setup for the project.
# It defines both the local development environment and the production-style app container.
services:
  # Development service (standaard - start met: docker compose up --build)
  dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
    volumes:
      - .:/app
    restart: unless-stopped

  # Production service (alleen starten met: docker compose --profile prod up --build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["prod"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
